[project]
name = "recall-lab"
version = "0.1.0"
description = "Research repo testing selective forgetting for long-running agent coherence."
requires-python = ">=3.11"
authors = [{ name = "Cynthia Omovoiye", email = "omovoiye@gmail.com" }]
dependencies = [
    "openai>=1.0",
    "chromadb>=0.5",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["recall_lab*"]

[tool.ruff]
line-length = 100
target-version = "py311"
